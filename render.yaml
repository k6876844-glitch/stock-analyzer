# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nse-stock-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL      # Neon Postgres connection string; without it data lives in SQLite and is lost on restart
        sync: false
      - key: SMTP_USER         # Gmail address that sends alert emails
        sync: false
      - key: SMTP_PASSWORD     # Gmail app password
        sync: false
      - key: CRON_SECRET       # key for /api/cron (external scheduler keeps alerts running)
        generateValue: true
      - key: APP_URL
        value: https://nse-stock-analyzer-6dwk.onrender.com
